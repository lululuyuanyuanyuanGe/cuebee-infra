[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cuebee-infra"
version = "0.1.0"
description = "Stateful streaming inference control plane for revisable speech transcripts"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Luyuan Ge"}]
dependencies = []

[project.scripts]
cuebee-server = "cuebee.api.server:main"
cuebee-demo = "cuebee.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["cuebee"]

